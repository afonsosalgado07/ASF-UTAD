{# Ícones SVG simples (traço), desenhados para este projeto #}
{% macro icone(nome, t=18) -%}
<svg width="{{ t }}" height="{{ t }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nome == 'mais' %}<path d="M12 5v14M5 12h14"/>
{%- elif nome == 'voltar' %}<path d="M15 6l-6 6 6 6"/>
{%- elif nome == 'lista' %}<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
{%- elif nome == 'sino' %}<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>
{%- elif nome == 'escudo' %}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>
{%- elif nome == 'relogio' %}<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>
{%- elif nome == 'chave' %}<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>
{%- elif nome == 'check2' %}<path d="M2 13l4 4 8-9M10 17l1 0 9-9"/>
{%- elif nome == 'check' %}<path d="M5 13l4 4 10-10"/>
{%- elif nome == 'pontos' %}<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>
{%- elif nome == 'alerta' %}<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>
{%- elif nome == 'seta' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif nome == 'camadas' %}<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>
{%- endif %}
</svg>
{%- endmacro %}

{% macro avatar(quem, tam=40) -%}
{% set a = avatares.get(quem, (quem[:2]|upper, '#9aa3af', quem)) %}
<span class="avatar" style="width:{{ tam }}px;height:{{ tam }}px;background:{{ a[1] }};font-size:{{ (tam * 0.3)|int }}px" title="{{ a[2] }}">{{ a[0] }}</span>
{%- endmacro %}
